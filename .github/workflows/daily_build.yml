name: Google AI YouTube Automation Pipeline

on:
  schedule:
    # KST = UTC+9, so 07:00 / 18:00 KST = 22:00 (prev day) / 09:00 UTC
    - cron: '0 22 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 시스템 의존성(FFmpeg, 한글 폰트) 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 파이썬 라이브러리 설치
        run: |
          pip install google-genai edge-tts moviepy google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: 파이프라인 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python auto_pipeline.py

      - name: 사용 기록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_log.csv
          if git diff --cached --quiet; then
            echo "No log changes to commit."
          else
            git commit -m "chore: update used_log.csv [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
